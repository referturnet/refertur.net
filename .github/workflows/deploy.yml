name: Deploy to WordPress

on:
  push:
    branches: [main]
    paths:
      - 'wordpress-migration/child-theme/**'
      - 'wordpress-migration/helper-plugin/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy child theme
        run: |
          rsync -avz --delete \
            wordpress-migration/child-theme/refertur-child/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.WP_PATH }}/wp-content/themes/refertur-child/

      - name: Deploy helper plugin
        run: |
          rsync -avz --delete \
            wordpress-migration/helper-plugin/refertur-site-core/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.WP_PATH }}/wp-content/plugins/refertur-site-core/

      - name: Flush WP cache
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.WP_PATH }} && wp cache flush --allow-root || true"
